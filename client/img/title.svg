<?xml version="1.0" encoding="UTF-8"?>
<!-- Фон меню «Rust & Magic»: руины города под магической луной. Оригинальная работа проекта, лицензия как у проекта. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120e1c"/><stop offset=".55" stop-color="#3a2230"/><stop offset=".8" stop-color="#7a3e1e"/><stop offset="1" stop-color="#2a1a10"/>
    </linearGradient>
    <radialGradient id="moon" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e8f4ff"/><stop offset=".6" stop-color="#9fd0ff"/><stop offset="1" stop-color="#5a8acf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7fb3d5" stop-opacity=".45"/><stop offset="1" stop-color="#7fb3d5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1d14"/><stop offset="1" stop-color="#0e0a08"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g fill="#fff" opacity=".6">
    <circle cx="120" cy="80" r="1.5"/><circle cx="340" cy="150" r="1"/><circle cx="520" cy="60" r="1.4"/><circle cx="760" cy="120" r="1"/>
    <circle cx="980" cy="50" r="1.2"/><circle cx="1400" cy="90" r="1.5"/><circle cx="1500" cy="200" r="1"/><circle cx="240" cy="260" r="1"/>
  </g>
  <circle cx="1180" cy="230" r="260" fill="url(#glow)"/>
  <circle cx="1180" cy="230" r="95" fill="url(#moon)"/>
  <g fill="none" stroke="#9fd0ff" stroke-width="2" opacity=".55">
    <circle cx="1180" cy="230" r="140" stroke-dasharray="6 10"/>
    <circle cx="1180" cy="230" r="168"/>
    <path d="M1180 62 l10 18 h-20z M1348 230 l-18 10 v-20z M1180 398 l-10 -18 h20z M1012 230 l18 -10 v20z"/>
  </g>
  <!-- дальние руины -->
  <path fill="#24161c" d="M0 620 L0 520 h60 v-60 h40 v80 h50 v-140 h70 v40 h20 v100 h80 v-60 h30 l20 -30 v90 h60 v-180 h25 v-30 h40 v30 h20 v210 h90 v-70 h60 v-40 h30 v110 h70 v-150 l40 -40 v190 h80 v-90 h50 v60 h60 v-200 h20 l30 30 v170 h70 v-50 h80 v80 h60 v-120 h40 v60 h60 v-30 h50 v90 h70 v-160 h40 v170 h60 v-40 h40 V620z"/>
  <g fill="#e8a24a" opacity=".7">
    <rect x="236" y="430" width="6" height="8"/><rect x="560" y="410" width="6" height="8"/><rect x="590" y="470" width="6" height="8"/>
    <rect x="1010" y="440" width="6" height="8"/><rect x="1330" y="470" width="6" height="8"/>
  </g>
  <!-- ближний план: холмы, искорёженные балки, башня мага -->
  <path fill="url(#ground)" d="M0 900 V660 Q200 600 420 650 T860 640 T1300 630 T1600 650 V900z"/>
  <g stroke="#3a2418" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M180 660 L240 540 L300 580"/><path d="M1340 650 l40 -120 l50 30"/>
  </g>
  <g fill="#1a110c">
    <path d="M760 660 l20 -230 l-14 -10 l34 -60 l34 60 l-14 10 l20 230z"/>
    <rect x="790" y="470" width="12" height="18" fill="#9fd0ff" opacity=".8"/>
  </g>
  <circle cx="800" cy="368" r="10" fill="#9fd0ff" opacity=".9"/>
  <circle cx="800" cy="368" r="40" fill="url(#glow)"/>
  <!-- ржавая машина и дракон на горизонте -->
  <g fill="#3b2216"><path d="M1040 690 h120 l20 -30 h-40 l-14 -20 h-60 l-16 20 h-20z"/><circle cx="1070" cy="694" r="14" fill="#120c08"/><circle cx="1150" cy="694" r="14" fill="#120c08"/></g>
  <path fill="#1a0e10" d="M420 300 q30 -30 60 -10 q20 -40 70 -30 q-30 10 -40 30 q30 0 40 20 q-40 -10 -60 0 q-30 20 -70 -10z"/>
  <!-- пыль -->
  <rect y="780" width="1600" height="120" fill="#000" opacity=".35"/>
</svg>
